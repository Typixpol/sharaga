<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Крестики-нолики на Canvas</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #282c34;
            color: #fff;
            font-family: sans-serif;
        }
        canvas {
            background-color: #fff;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #status {
            margin-top: 15px;
            font-size: 20px;
        }
        button {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            background-color: #61dafb;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="board" width="600" height="600"></canvas>
    <div id="status">Ходят крестики (X)</div>
    <button onclick="resetGame()">Начать заново</button>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        const size = 600;
        const cols = 3;
        const rows = 3;
        const cellSize = size / cols;

        let board = [
            ['', '', ''],
            ['', '', ''],
            ['', '', '']
        ];

        let currentPlayer = 'X';
        let gameActive = true;

        // Рисуем сетку
        function drawGrid() {
            ctx.clearRect(0, 0, size, size);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 4;

            // Вертикальные линии
            for (let i = 1; i < cols; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, size);
                ctx.stroke();
            }

            // Горизонтальные линии
            for (let i = 1; i < rows; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(size, i * cellSize);
                ctx.stroke();
            }
        }

        // Рисуем крестик или нолик
        function drawSymbol(row, col, symbol) {
            const x = col * cellSize + cellSize / 2;
            const y = row * cellSize + cellSize / 2;
            const offset = cellSize * 0.3;

            ctx.lineWidth = 6;

            if (symbol === 'X') {
                ctx.strokeStyle = '#e74c3c';
                ctx.beginPath();
                ctx.moveTo(x - offset, y - offset);
                ctx.lineTo(x + offset, y + offset);
                ctx.moveTo(x + offset, y - offset);
                ctx.lineTo(x - offset, y + offset);
                ctx.stroke();
            } else {
                ctx.strokeStyle = '#3498db';
                ctx.beginPath();
                ctx.arc(x, y, offset, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // Проверка победителя
        function checkWinner() {
            // Проверка строк и столбцов
            for (let i = 0; i < 3; i++) {
                if (board[i][0] && board[i][0] === board[i][1] && board[i][0] === board[i][2]) {
                    return board[i][0];
                }
                if (board[0][i] && board[0][i] === board[1][i] && board[0][i] === board[2][i]) {
                    return board[0][i];
                }
            }

            // Проверка диагоналей
            if (board[0][0] && board[0][0] === board[1][1] && board[0][0] === board[2][2]) {
                return board[0][0];
            }
            if (board[0][2] && board[0][2] === board[1][1] && board[0][2] === board[2][0]) {
                return board[0][2];
            }

            // Проверка на ничью
            let isDraw = board.flat().every(cell => cell !== '');
            if (isDraw) return 'Draw';

            return null;
        }

        // Обработка клика по холсту
        canvas.addEventListener('click', (e) => {
            if (!gameActive) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const col = Math.floor(mouseX / cellSize);
            const row = Math.floor(mouseY / cellSize);

            if (board[row][col] === '') {
                board[row][col] = currentPlayer;
                drawSymbol(row, col, currentPlayer);

                let winner = checkWinner();
                if (winner) {
                    gameActive = false;
                    if (winner === 'Draw') {
                        statusDiv.textContent = 'Ничья!';
                    } else {
                        statusDiv.textContent = `Победили ${winner === 'X' ? 'крестики (X)' : 'нолики (O)'}!`;
                    }
                } else {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    statusDiv.textContent = `Ходят ${currentPlayer === 'X' ? 'крестики (X)' : 'нолики (O)'}`;
                }
            }
        });

        // Сброс игры
        function resetGame() {
            board = [
                ['', '', ''],
                ['', '', ''],
                ['', '', '']
            ];
            currentPlayer = 'X';
            gameActive = true;
            statusDiv.textContent = 'Ходят крестики (X)';
            drawGrid();
        }

        // Инициализация при запуске
        drawGrid();
    </script>
</body>
</html>
